services:
  mongo:
    image: mongo:9.0
    container_name: marketplace_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: marketplace
    volumes:
      - mongo_data:/data/db
    networks:
      - shop_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/marketplace
      JWT_SECRET: lab-secret-jwt-key-development-2026
      NODE_ENV: production
    depends_on:
      - mongo
    networks:
      - shop_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: marketplace_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shop_net

networks:
  shop_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
